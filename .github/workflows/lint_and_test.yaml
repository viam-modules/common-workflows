name: Lint Check and Test

on:
  workflow_call:
    inputs:
      test_script_name:
        type: string
        default: scripts/test.sh
    secrets:
      VIAM_API_KEY_ID:
        required: true
      VIAM_API_KEY:
        required: true
      VIAM_ORG_ID:
        required: true
      VIAM_DATASET_ID:
        required: true
      TOKEN:
        required: false
jobs:
  build:
    runs-on: ubuntu-latest-2cpu-75gb
    name: Lint and Test Code
    container:
      image: us-docker.pkg.dev/vertex-ai/training/tf-gpu.2-16.py310@sha256:88dfb14472ead40bfa4a39a263820654d7f9403e5d1a945d87790ce87afb8b69
    steps:
    - name: Debug - Check initial disk space
      run: |
        echo "=== Disk space before checkout ==="
        df -h
        echo ""
        echo "=== Largest directories on root filesystem ==="
        du -h / 2>/dev/null | sort -rh | head -30 || true
        echo ""
        echo "=== /var/lib/docker size ==="
        du -sh /var/lib/docker 2>/dev/null || true
        echo ""
        echo "=== Breakdown of major directories ==="
        du -sh /usr /var /opt /home /root /tmp 2>/dev/null || true
        echo ""
        echo "=== Docker images ==="
        docker images || true
        echo ""
        echo "=== Docker system df ==="
        docker system df || true
        
    - name: Free up disk space
      run: |
        echo "=== Freeing up disk space ==="
        # Remove unused Docker images and containers
        docker system prune -af || true
        # Clean apt cache
        apt-get clean || true
        rm -rf /var/lib/apt/lists/* || true
        # Remove large unused tools
        rm -rf /usr/share/dotnet || true
        rm -rf /usr/local/lib/android || true
        rm -rf /opt/ghc || true
        echo "=== Disk space after cleanup ==="
        df -h
    
    - uses: actions/checkout@v3
      with:
        submodules: recursive
        token: ${{ secrets.TOKEN || github.token }}
    - name: Debug - Check disk space after checkout
      run: |
        echo "=== Disk space after checkout ==="
        df -h
        echo "=== Size of workspace ==="
        du -sh $GITHUB_WORKSPACE
    - name: Install dependencies
      run: |
        apt-get update
        python -m pip install --upgrade pip
        pip install black pytest
    - name: Debug - Check disk space after dependencies
      run: |
        echo "=== Disk space after installing dependencies ==="
        df -h
        echo "=== Apt cache size ==="
        du -sh /var/cache/apt || true
        echo "=== Pip cache size ==="
        du -sh ~/.cache/pip || true
    - name: Lint
      run: black . --check
    - name: Setup Viam CLI
      shell: bash
      run: |
        curl -o /usr/local/bin/viam https://storage.googleapis.com/packages.viam.com/apps/viam-cli/viam-cli-stable-linux-amd64
        chmod a+rx /usr/local/bin/viam
        viam login api-key --key-id ${{ secrets.VIAM_API_KEY_ID }} --key ${{ secrets.VIAM_API_KEY }}
    - name: Download dataset file
      shell: bash
      run: |
        viam dataset export --destination=. --dataset-id=${{ secrets.VIAM_DATASET_ID }}
    - name: Debug - Check disk space after dataset download
      run: |
        echo "=== Disk space after dataset download ==="
        df -h
        echo "=== Downloaded dataset size ==="
        ls -lh . || true
    - name: Run script locally with unit test
      run: ${{inputs.test_script_name}}
      env: 
        API_KEY: ${{ secrets.VIAM_API_KEY }}
        API_KEY_ID: ${{ secrets.VIAM_API_KEY_ID }}

