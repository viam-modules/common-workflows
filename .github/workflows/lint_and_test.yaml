name: Lint Check and Test

on:
  workflow_call:
    inputs:
      test_script_name:
        type: string
        default: scripts/test.sh
      container_image:
        type: string
    secrets:
      VIAM_API_KEY_ID:
        required: true
      VIAM_API_KEY:
        required: true
      VIAM_ORG_ID:
        required: true
      VIAM_DATASET_ID:
        required: true
      TOKEN:
        required: false
jobs:
  resolve-container:
    runs-on: ubuntu-latest
    name: Resolve Container URI
    outputs:
      container_uri: ${{ steps.resolve.outputs.container_uri }}
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget curl jq
        # Install grpcurl
        wget https://github.com/fullstorydev/grpcurl/releases/download/v1.8.9/grpcurl_1.8.9_linux_x86_64.tar.gz
        tar -xzf grpcurl_1.8.9_linux_x86_64.tar.gz
        mv grpcurl /usr/local/bin/
        # Install buf
        wget https://github.com/bufbuild/buf/releases/download/v1.30.0/buf-Linux-x86_64
        chmod +x buf-Linux-x86_64
        mv buf-Linux-x86_64 /usr/local/bin/buf
    - name: Resolve container URI from gRPC endpoint
      id: resolve
      run: |
        set -euo pipefail
        
        CONTAINER_KEY="${{ inputs.container_image }}"
        
        # Validate input
        if [ -z "$CONTAINER_KEY" ]; then
          echo "❌ Error: container_image input is required"
          exit 1
        fi
        
        # Build protosets with error handling
        GOUTILS_PROTOSET=$(mktemp)
        API_PROTOSET=$(mktemp)
        trap "rm -f $GOUTILS_PROTOSET $API_PROTOSET" EXIT
        
        echo "Building protosets..."
        if ! buf build -o "$GOUTILS_PROTOSET" buf.build/viamrobotics/goutils; then
          echo "⚠️  Warning: Failed to build goutils protoset. Using container_image as-is."
          echo "container_uri=$CONTAINER_KEY" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        if ! buf build -o "$API_PROTOSET" buf.build/viamrobotics/api; then
          echo "⚠️  Warning: Failed to build api protoset. Using container_image as-is."
          echo "container_uri=$CONTAINER_KEY" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        # Step 1: Get auth token
        TOKEN=$(grpcurl -d "{
          \"entity\": \"${{ secrets.VIAM_API_KEY_ID }}\",
          \"credentials\": {
            \"type\": \"api-key\",
            \"payload\": \"${{ secrets.VIAM_API_KEY }}\"
          }
        }" -protoset "$GOUTILS_PROTOSET" app.viam.com:443 proto.rpc.v1.AuthService/Authenticate | jq -r .accessToken)
        
        if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
          echo "⚠️  Warning: Failed to authenticate. Using container_image as-is."
          echo "container_uri=$CONTAINER_KEY" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        # Step 2: Call ListSupportedContainers
        CONTAINER_RESPONSE=$(grpcurl \
          -H "authorization: Bearer $TOKEN" \
          -d '{}' \
          -protoset "$API_PROTOSET" \
          app.viam.com:443 \
          viam.app.mltraining.v1.MLTrainingService/ListSupportedContainers)
        
        if [ -z "$CONTAINER_RESPONSE" ]; then
          echo "⚠️  Warning: Failed to fetch supported containers. Using container_image as-is."
          echo "container_uri=$CONTAINER_KEY" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        # Step 3: Look up container_image in the response
        CONTAINER_URI=$(echo "$CONTAINER_RESPONSE" | jq -r --arg key "$CONTAINER_KEY" '.containerMap[$key].uri // empty')
        
        if [ -z "$CONTAINER_URI" ] || [ "$CONTAINER_URI" = "null" ]; then
          echo "⚠️  Warning: Container key '$CONTAINER_KEY' not found in supported containers. Using provided value as URI."
          CONTAINER_URI="$CONTAINER_KEY"
        else
          echo "✓ Found container URI for key '$CONTAINER_KEY': $CONTAINER_URI"
        fi
        
        echo "container_uri=$CONTAINER_URI" >> $GITHUB_OUTPUT
  build:
    needs: resolve-container
    runs-on: ubuntu-latest-4cpu-150gb
    name: Lint and Test Code
    container:
      image: ${{ needs.resolve-container.outputs.container_uri }}
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
        token: ${{ secrets.TOKEN || github.token }}
    - name: Install dependencies
      run: |
        apt-get update
        python -m pip install --upgrade pip
        pip install black pytest
    - name: Lint
      run: black . --check
    - name: Setup Viam CLI
      shell: bash
      run: |
        curl -o /usr/local/bin/viam https://storage.googleapis.com/packages.viam.com/apps/viam-cli/viam-cli-stable-linux-amd64
        chmod a+rx /usr/local/bin/viam
        viam login api-key --key-id ${{ secrets.VIAM_API_KEY_ID }} --key ${{ secrets.VIAM_API_KEY }}
    - name: Download dataset file
      shell: bash
      run: |
        viam dataset export --destination=. --dataset-id=${{ secrets.VIAM_DATASET_ID }}
    - name: Run script locally with unit test
      run: ${{inputs.test_script_name}}
      env: 
        API_KEY: ${{ secrets.VIAM_API_KEY }}
        API_KEY_ID: ${{ secrets.VIAM_API_KEY_ID }}
